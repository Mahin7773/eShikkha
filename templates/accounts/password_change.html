{% extends "base.html" %}
{% block title %}Change password – {{ platform.site_name }}{% endblock %}
{% block content %}
<div class="container container-narrow">
  <div class="page-header"><h1>Change password</h1><p>Use at least 8 characters that aren't easy to guess.</p></div>
  <div class="tabs mb-5"><a href="{% url 'accounts:profile' %}">Profile</a><a class="active" href="{% url 'accounts:password_change' %}">Password</a></div>
  <form method="post" novalidate data-once style="max-width:460px">
    {% csrf_token %}
    {% include "partials/form.html" with single=True %}
    <div class="form-actions"><button class="btn btn-primary" type="submit">Update password</button></div>
  </form>
</div>
{% endblock %}
