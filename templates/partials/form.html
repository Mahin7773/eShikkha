{% if form.non_field_errors %}<div class="alert alert-error mb-4" role="alert">{% for e in form.non_field_errors %}<div>{{ e }}</div>{% endfor %}</div>{% endif %}
{% for hidden in form.hidden_fields %}{{ hidden }}{% endfor %}
<div class="{% if single %}stack{% else %}form-grid{% endif %}">
  {% for field in form.visible_fields %}{% include "partials/field.html" with span=single %}{% endfor %}
</div>
