<span class="stars-wrap" aria-label="Rated {{ rating|floatformat:1 }} out of 5{% if count is not None %}, {{ count }} review{{ count|pluralize }}{% endif %}">{% if show_number %}<span class="num" aria-hidden="true">{{ rating|floatformat:1 }}</span>{% endif %}<span class="stars" style="--percent: {{ percent|stringformat:'s' }}%" aria-hidden="true"></span>{% if count is not None %}<span class="muted" aria-hidden="true">({{ count }})</span>{% endif %}</span>
